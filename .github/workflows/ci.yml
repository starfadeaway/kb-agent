name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 是**功能性要求**，不是"历史完整一点"的美观设置。
          #
          # 三条双向验证守卫（test_run_eval_multigame / test_exp_d_missing_model /
          # test_model_compare_control）会用 `git worktree add` 检出**改造前的固定
          # commit**（17f285f / acbb64f），实跑旧代码确认守卫会红。
          # 默认 fetch-depth: 1 的浅克隆里取不到那些 commit ——
          # 实测 `git cat-file -t 17f285f` 返回 `fatal: Not a valid object name`，
          # 于是三条守卫全部走 pytest.skip，CI 上从来没真正执行过。
          # 也就是说「双向验证已完成」这个结论只有本地证据，没有 CI 证据。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # pytest 套件刻意不打网络：断言的是纯函数（路由、过滤器、schema、
      # 配置契约、AST 白名单），任何一项要调 API 才能跑就说明设计跑偏了。
      - name: ruff
        run: ruff check backend

      - name: pytest
        run: python -m pytest -p no:cacheprovider

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # tsc -b 不是摆设：Sidebar 那次"虚高 4.4 倍"的统计 bug 就是
      # 类型不匹配（collection 缺 game/variant 字段）被 tsc 挡下来的。
      - run: npm run build

  secrets:
    name: 仓库卫生（密钥不得入库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .env 被 gitignore 了，但要确认它真的没在任何一次提交里出现过。
      # 只查 HEAD 不够 —— 密钥可能在中途某次提交进来过、后来又删掉。
      - name: 历史中不得出现 .env
        run: |
          if git log --all --name-only --pretty=format: | grep -x '.env'; then
            echo "::error::历史提交里出现过 .env，请轮换密钥并清理历史"
            exit 1
          fi
          echo "ok: 历史中无 .env"

      - name: 不得跟踪大索引与依赖目录
        run: |
          tracked=$(git ls-files | grep -E '^(data/(lance|vectors|raw)/|\.venv/|frontend/node_modules/)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::以下文件不应入库:"
            echo "$tracked"
            exit 1
          fi
          echo "ok: 无大文件入库"