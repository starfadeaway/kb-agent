<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      theme-color 的初值。深色主题的 --bg 是 #080d14（见 styles.css），
      这里必须与之保持一致 —— 它是 React 挂载前唯一一帧的地址栏配色。
      ⚠️ 换配色时这三处（这里、内联脚本、styles.css）都要动，
      tests/prefs.test.ts 有一条断言专门钉住它们不相等。
    -->
    <meta name="theme-color" content="#080d14" />
    <title>lorekeeper · 游戏内容知识库问答</title>
    <script>
      // 在样式和 React 之前定好主题，否则会先按默认深色渲染再跳到浅色（白闪）。
      // 这里不能用 import —— 内联脚本必须同步可执行，所以逻辑在这里重写一遍，
      // 规则和 src/prefs.ts 的 readStoredTheme 保持一致。
      (function () {
        try {
          var saved = localStorage.getItem('lorekeeper.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            // 从已加载的样式表里读当前主题的 --bg，而不是在这里写死颜色。
            // 写死过一次并且真的漂了：CSS 换成深靛配色后这里的 meta 还停在
            // 旧配色的 #0e1116，功能全对、测试全绿，只有地址栏露馅。
            var bg = ''
            try {
              bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()
            } catch (e) {
              /* 样式表还没就绪 */
            }
            // 读不到就保持 meta 原值：content="" 会让浏览器退回默认色，
            // 比用一个略旧的固定色更糟。
            if (bg) meta.setAttribute('content', bg)
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，保持默认深色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
